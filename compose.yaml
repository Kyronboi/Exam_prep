
services:
  exam_prep_mysql:
    image: mysql:8.0
    container_name: exam_prep_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - exam_prep-db-data:/var/lib/mysql  # Corrected volume name
    networks:
      - exam_prep-network

  exam_prep_phpmyadmin:
    image: phpmyadmin
    container_name: exam_prep_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: exam_prep_mysql
    ports:
      - "8081:80"
    networks:
      - exam_prep-network

volumes:
  exam_prep-db-data:  # Corrected definition

networks:
  exam_prep-network:
